}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);margin:0}
.wrap{max-width:1240px;margin:0 auto;padding:16px 16px 56px}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance}
h1{font-size:1.45rem;font-weight:700;letter-spacing:-.01em}
h2{font-size:1.05rem;font-weight:700}
h3{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
p{margin:0}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--muted)}
small,.small{font-size:.8rem}

header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 20px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand svg{width:40px;height:40px;flex:none}
.brand p{color:var(--muted);font-size:.85rem}
.saved{font-size:.8rem;color:var(--muted)}
nav.tabs{display:flex;gap:4px;margin:14px 0 16px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
nav.tabs button{flex:none;font:600 .9rem var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:999px;cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.grid2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start;margin-bottom:16px}
@media (max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card + .card{margin-top:16px}
.card-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.how p + p{margin-top:8px}
.how p{font-size:.88rem;color:var(--muted)}
.how b{color:var(--ink)}
.formula{font-weight:600;color:var(--ink);background:var(--surface-2);border-left:3px solid var(--accent);padding:6px 10px;border-radius:0 6px 6px 0;margin:8px 0;font-size:.9rem}

.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:.78rem;font-weight:600;color:var(--muted)}
.field .hint{font-size:.75rem;color:var(--muted)}
.field.wide{grid-column:1/-1}
input[type=text],input[type=date],select,textarea{font:inherit;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:7px 9px;width:100%;min-width:0}
input.n{font-variant-numeric:tabular-nums;text-align:right}
textarea{font:.78rem/1.4 var(--f-mono);resize:vertical}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px;margin:0}
.affix{display:flex;align-items:stretch}
.affix span{display:flex;align-items:center;padding:0 8px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:.8rem}
.affix span:first-child{border-radius:7px 0 0 7px;border-right:0}
.affix span:last-child{border-radius:0 7px 7px 0;border-left:0}
.affix input{border-radius:0}
.affix span:first-child + input:last-child{border-radius:0 7px 7px 0}
.affix input:first-child{border-radius:7px 0 0 7px}
.check{display:flex;align-items:center;gap:8px;font-size:.85rem}

.btn{font:600 .85rem var(--f-body);border-radius:7px;padding:8px 12px;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);white-space:nowrap}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.sm{padding:5px 10px;font-size:.8rem}
.btn.danger{border-color:var(--bad);color:var(--bad);background:transparent}
.btn.danger.armed{background:var(--bad);color:#fff}
.icon-btn{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:1.1rem;line-height:1;padding:4px 8px;border-radius:6px}
.icon-btn:hover{background:var(--surface-2);color:var(--bad)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spacer{flex:1}

.pill{display:inline-block;font-size:.75rem;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.st-ok{background:var(--ok-soft);color:var(--ok)}
.st-abaixo,.st-alta{background:var(--warn-soft);color:var(--warn)}
.st-prejuizo,.st-baixa{background:var(--bad-soft);color:var(--bad)}
.st-semcusto,.st-semprec{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.badge{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:1px 6px;border-radius:4px;background:var(--warn-soft);color:var(--warn);margin-left:6px;vertical-align:1px}

.big{font-size:1.9rem;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:14px}
.kpi{background:var(--surface-2);border-radius:8px;padding:10px 12px}
.kpi .v{font-size:1.2rem;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .l{font-size:.75rem;color:var(--muted)}
.kpi.bad .v{color:var(--bad)} .kpi.warn .v{color:var(--warn)} .kpi.ok .v{color:var(--ok)}

.bar{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:12px 0 8px;background:var(--surface-2)}
.bar span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.78rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar input[type=text]{max-width:280px}
.toolbar select{width:auto}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font:600 .78rem var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:5px 10px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink);border-color:var(--accent)}

.tbl-wrap{overflow-x:auto;margin:0 -16px;padding:0 16px}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
th.r,td.r{text-align:right}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface-2)}
td small{display:block;color:var(--muted);font-size:.75rem}
td.name{min-width:200px;max-width:380px}
td .sug{font-weight:700;color:var(--accent)}
.empty{padding:28px 8px;text-align:center;color:var(--muted)}

.modal{position:fixed;inset:0;background:rgba(10,20,18,.5);display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow-y:auto;z-index:10}
.modal[hidden]{display:none}
.sheet{background:var(--surface);border-radius:12px;width:100%;max-width:760px;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.sheet header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
.sheet footer{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
@media (max-width:600px){.modal{padding:0}.sheet{border-radius:0;min-height:100%}}
.result{margin-top:16px;background:var(--surface-2);border-radius:10px;padding:14px}
.result .lines{display:grid;grid-template-columns:1fr auto;gap:4px 16px;font-size:.88rem;margin-top:10px}
.result .lines .tot{font-weight:700;border-top:1px solid var(--line);padding-top:4px}
.result .lines .num{text-align:right}
.res-head{display:flex;flex-wrap:wrap;gap:16px 28px;align-items:flex-end}
.res-head .l{font-size:.75rem;color:var(--muted)}
.sub{margin-top:16px}
.sub h3{margin-bottom:8px}
.lines-tbl td{padding:5px 4px}
.lines-tbl input{padding:5px 7px}
.msg{font-size:.85rem;margin-top:8px;min-height:1.2em}
.msg.ok{color:var(--ok)} .msg.bad{color:var(--bad)}
.alert{border-radius:8px;padding:10px 12px;font-size:.88rem;margin-top:12px}
.alert.bad{background:var(--bad-soft);color:var(--ink);border-left:4px solid var(--bad)}
.alert.warn{background:var(--warn-soft);color:var(--ink);border-left:4px solid var(--warn)}
.alert.ok{background:var(--ok-soft);color:var(--ink);border-left:4px solid var(--ok)}
.nf-list .nf{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.nf-list .nf:last-child{border-bottom:0}
.hide-android{} body.android .hide-android{display:none}
@media print{nav.tabs,.toolbar,.btn{display:none}}
</style>
</head>

  if (m <= 35) return ['st-alta', 'Alta: compare com a concorrência'];
  return ['st-baixa', 'Muito alta: risco de perder clientes'];
}
function compBar(parts) {
  const tot = parts.reduce((a, p) => a + Math.max(0, p[1]), 0) || 1;
  return `<div class="bar">${parts.map(p => `<span style="width:${Math.max(0, p[1]) / tot * 100}%;background:var(${p[2]})" title="${esc(p[0])}"></span>`).join('')}</div>
  <div class="legend">${parts.map(p => `<span><i style="background:var(${p[2]})"></i>${esc(p[0])} <b class="num">${pct(p[1])}</b></span>`).join('')}</div>`;
}

const ORD_ST = { prejuizo: 0, abaixo: 1, semcusto: 2, semprec: 3, ok: 4 };
function updProdutos() {
  if (TAB !== 'produtos') return;
  const P = S.params, b = base(), map = custosNF();
  const [cls, lab] = saude(P.margProd);
  const sp = $('#pSaude'); sp.className = 'pill ' + cls; sp.textContent = lab;
  const marg = (P.margProd || 0) / 100;

  $('#pResumo').innerHTML = div > 0 ? `
    <div class="kpis">

    : `<div class="alert bad">Custos fixos (${pct(b.dfProd)}) + impostos + cartão + lucro passam de 100% do preço. Reduza a margem ou a parcela de custos fixos dos produtos na aba Custos da clínica.</div>`;
  let rows = S.produtos.map(p => ({ p, r: calcProd(p, b, map) }));
  const cont = { todos: rows.length, prejuizo: 0, abaixo: 0, semcusto: 0, ok: 0 };
  rows.forEach(x => { if (x.r.st in cont) cont[x.r.st]++; });
  $('#pChips').innerHTML = [['todos', 'Todos'], ['prejuizo', 'Prejuízo'], ['abaixo', 'Abaixo da meta'], ['semcusto', 'Sem custo'], ['ok', 'Saudáveis']]

      <td><span class="pill st-${r.st}">${ST_LABEL[r.st]}</span></td>
    </tr>`).join('') : `<tr><td colspan="7" class="empty">Nenhum produto neste filtro.</td></tr>`;
}

}
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal' || e.target.closest('[data-close]')) closeModal(); });

    () => updProdutos());
  const upd = () => {
    const b = base(), r = calcProd(p, b, custosNF());
    $('#mRes').innerHTML = !r.ct ? `<p class="muted">Informe o custo de compra para calcular o preço.</p>` : `
      <div class="res-head">
        <div><div class="l">Preço sugerido</div><div class="big" style="color:var(--accent)">${money(r.sug)}</div></div>
        <div><div class="l">Preço mínimo (lucro zero)</div><div class="v num" style="font-weight:700">${money(r.min)}</div></div>
        <div><div class="l">Markup</div><div class="num" style="font-weight:700">${fmt(r.markup)} ×</div></div>
        ${p.atual > 0 ? `<div><div class="l">Preço atual</div><div class="num" style="font-weight:700">${money(p.atual)} <span class="pill st-${r.st}">${ST_LABEL[r.st]}</span></div></div>` : ''}
      </div>

        <span>Perdas / vencimento (${pct(r.perdas)})</span><span class="num">${money(r.ct - r.c.v)}</span>
        <span class="tot">Custo total</span><span class="num tot">${money(r.ct)}</span>
        <span>Custos fixos da clínica (${pct(b.dfProd)} do preço)</span><span class="num">${money(r.sug * b.dfProd)}</span>
        <span>Impostos (${pct((P.impProd || 0) / 100)})</span><span class="num">${money(r.sug * (P.impProd || 0) / 100)}</span>
        <span>Cartão e comissão (${pct(((P.cartao || 0) + (P.comissao || 0)) / 100)})</span><span class="num">${money(r.sug * ((P.cartao || 0) + (P.comissao || 0)) / 100)}</span>

      </div>`;
  };
  $('#sheet').addEventListener('input', e => {
    const f = e.target.dataset.f; if (!f) return;
    if (f === 'nome') p.nome = e.target.value;
    else if (f === 'manual') p.manual = e.target.checked;
    else p[f] = numOrNull(e.target.value);
    if (f === 'custo' && hist.length) { p.manual = p.custo != null; const cb = $('#sheet [data-f="manual"]'); if (cb) cb.checked = p.manual; }
    save(); upd();
  });
  $('#sheet').addEventListener('change', e => { if (e.target.dataset.f === 'manual') { p.manual = e.target.checked; save(); upd(); } });
  $('#mDel').addEventListener('click', () => {
    S.produtos = S.produtos.filter(x => x.id !== p.id); save(); closeModal();
  });
  upd();
}

function salvarNF() {
  const d = S.draft, msg = $('#nfMsg');
  const itens = d.itens.filter(i => (i.nome || '').trim() || i.q || i.vu);
  const ruim = itens.find(i => !(i.nome || '').trim() || !(i.q > 0) || !(i.vu > 0));
  if (!itens.length || ruim) { msg.className = 'msg bad'; msg.textContent = !itens.length ? 'Adicione pelo menos um item.' : `Confira o item "${ruim.nome || 'sem nome'}": precisa de nome, quantidade e valor unitário.`; return; }
  let novos = 0;
  const out = itens.map(i => {
    const nome = i.nome.trim();
    let p = findProd(nome) || (i.nomeNF ? findProd(i.nomeNF) : null);
    if (!p) { p = { id: uid(), nome, qtd: 0, atual: null }; S.produtos.push(p); novos++; }
    if (i.nomeNF && norm(i.nomeNF) !== norm(p.nome)) { p.aliases ||= []; if (!p.aliases.some(a => norm(a) === norm(i.nomeNF))) p.aliases.push(i.nomeNF); }
    if (p.manual) delete p.manual;
    return { prod: p.id, nome: p.nome, nomeNF: i.nomeNF || '', q: i.q, vu: i.vu, fator: i.fator > 0 ? i.fator : 1 };
  });
  const nf = { id: d.id || uid(), criado: d.criado || Date.now(), forn: d.forn.trim(), num: String(d.num || '').trim(), data: d.data || today(), frete: d.frete, outras: d.outras, desc: d.desc, itens: out };
  const ix = S.nfs.findIndex(n => n.id === nf.id);
  if (ix > -1) S.nfs[ix] = nf; else S.nfs.push(nf);
  S.draft = emptyDraft(); save(); refreshDatalists(); renderNotas();
  const m = $('#nfMsg'); m.className = 'msg ok';
  m.textContent = `Nota ${nf.num || ''} salva: ${out.length} ${out.length === 1 ? 'custo atualizado' : 'custos atualizados'}${novos ? `, ${novos} ${novos === 1 ? 'produto novo criado' : 'produtos novos criados'}` : ''}. Veja os preços na aba Produtos.`;
}
function parseNFe(text) {
  const doc = new DOMParser().parseFromString(text, 'application/xml');
  if (doc.getElementsByTagName('parsererror').length) throw new Error('arquivo não é um XML válido');
  const g = (el, tag) => { const x = el && el.getElementsByTagName(tag)[0]; return x ? x.textContent.trim() : ''; };
  const f = (el, tag) => parseFloat(g(el, tag)) || 0;
  const ide = doc.getElementsByTagName('ide')[0], emit = doc.getElementsByTagName('emit')[0], tot = doc.getElementsByTagName('ICMSTot')[0];
  const dets = [...doc.getElementsByTagName('det')];
  if (!dets.length) throw new Error('nenhum produto encontrado no XML');
  const itens = dets.map(det => {
    const p = det.getElementsByTagName('prod')[0];
    const nomeNF = g(p, 'xProd');
    const prod = findProd(nomeNF);
    return { nome: prod ? prod.nome : nomeNF, nomeNF, q: f(p, 'qCom'), vu: f(p, 'vUnCom'), fator: 1 };
  });
  return {
    forn: g(emit, 'xFant') || g(emit, 'xNome'), num: g(ide, 'nNF'), data: (g(ide, 'dhEmi') || g(ide, 'dEmi') || today()).slice(0, 10),
    frete: f(tot, 'vFrete') || null, outras: (f(tot, 'vST') + f(tot, 'vIPI') + f(tot, 'vOutro') + f(tot, 'vSeg') + f(tot, 'vFCPST')) || null, desc: f(tot, 'vDesc') || null, itens
  };
}
async function importXML(e) {
  const files = [...e.target.files]; e.target.value = '';
  const msg = $('#nfMsg');
  const lidas = [];
  for (const file of files) {
    try { lidas.push(parseNFe(await file.text())); }
    catch (err) { msg.className = 'msg bad'; msg.textContent = `${file.name}: ${err.message}.`; return; }
  }
  if (!lidas.length) return;
  if (lidas.length === 1) {
    S.draft = lidas[0]; save(); renderNotas();
    const m = $('#nfMsg'); m.className = 'msg ok';
    m.textContent = 'XML importado. Confira os nomes dos produtos (escolha o produto da clínica correspondente), ajuste "Fracionar em" e salve.';
  } else {
    for (const nf of lidas) {
      nf.itens = nf.itens.map(i => { let p = findProd(i.nome) || findProd(i.nomeNF); if (!p) { p = { id: uid(), nome: i.nome, qtd: 0, atual: null }; S.produtos.push(p); } return { ...i, prod: p.id, nome: p.nome }; });
      S.nfs.push({ id: uid(), criado: Date.now(), ...nf });
    }
    save(); refreshDatalists(); renderNotas();
    const m = $('#nfMsg'); m.className = 'msg ok';
    m.textContent = `${lidas.length} notas importadas e salvas. Use "Editar" para ajustar fracionamento ou nomes.`;
  }
}

      <div class="row"><button class="btn ghost sm" id="cColar">Colar do Excel</button><button class="btn sm" id="cAdd">+ Custo</button></div></div>
    <div id="cPaste" hidden style="margin-bottom:14px">
      <textarea id="cPasteTxt" rows="6" placeholder="Copie as colunas Origem do Boleto e Valor no Excel e cole aqui"></textarea>
      <div class="row" style="margin-top:8px"><button class="btn sm" id="cPasteAdd">Adicionar à lista</button><button class="btn danger sm" id="cPasteRep" data-confirm="Apagar a lista atual e colar?">Substituir a lista</button><span class="small muted">O tipo é sugerido pelo nome; confira depois.</span></div>
    </div>
    <div id="cTot" class="kpis" style="margin:0 0 14px"></div>
    <div class="tbl-wrap"><table class="lines-tbl">
      <thead><tr><th>Origem</th><th class="r">Valor</th><th>Tipo</th><th>Venc.</th><th></th></tr></thead>
      <tbody id="cBody"></tbody>
    </table></div>
    <p class="small muted" style="margin-top:8px"><b>Custos fixos</b>, empréstimos e pró-labore são divididos entre produtos e serviços. <b>Compras de mercadoria</b> não entram no rateio: o custo delas chega pelo preço de compra de cada produto (notas de entrada). Impostos e cartão entram como percentual sobre o preço.</p>
  </div>
  <div class="card">
    <div class="card-head"><h2>Backup dos dados</h2></div>
    <p class="small muted">Os dados ficam salvos neste aparelho${PLAT === 'windows' ? ' (pasta %APPDATA%\\VetClin Preco de Venda)' : ''}. Para levar para outro aparelho, gere o backup, copie o texto e cole no outro.</p>
    <div class="row" style="margin-top:10px">
      <button class="btn sm" id="bkGen">Gerar backup e copiar</button>
      ${PLAT === 'windows' ? '<button class="btn ghost sm" id="bkFile">Salvar backup em Documentos</button>' : ''}
      <button class="btn ghost sm" id="bkLoad" data-confirm="Substituir tudo pelo backup?">Restaurar do texto abaixo</button>
      <span class="spacer"></span>
      <button class="btn danger sm" id="bkReset" data-confirm="Apagar tudo e voltar à planilha?">Voltar aos dados da planilha</button>
    </div>
    <textarea id="bkText" rows="4" style="margin-top:10px" placeholder="O backup aparece aqui. Para restaurar, cole o texto do backup aqui."></textarea>
    <div class="msg" id="bkMsg"></div>
  </div>`;
  cList(); updCustos();
  $('#cAdd').addEventListener('click', () => { S.custos.push({ id: uid(), nome: '', valor: null, tipo: 'fixo' }); save(); cList(); updCustos(); const l = $$('#cBody [data-c="nome"]').pop(); if (l) l.focus(); });
  $('#cColar').addEventListener('click', () => { const b = $('#cPaste'); b.hidden = !b.hidden; if (!b.hidden) $('#cPasteTxt').focus(); });
  $('#cPasteAdd').addEventListener('click', () => colar(false));
  $('#cPasteRep').addEventListener('click', () => colar(true));
  const body = $('#cBody');
  body.addEventListener('input', e => {
    const t = e.target, k = t.dataset.c; if (!k) return;
    const c = S.custos.find(x => x.id === t.closest('tr').dataset.id);
    c[k] = k === 'valor' ? numOrNull(t.value) : t.value;
    if (c.conferir) { delete c.conferir; const bd = t.closest('tr').querySelector('.badge'); if (bd) bd.remove(); }
    save(); updCustos();
  });
  body.addEventListener('change', e => { if (e.target.dataset.c === 'tipo') { const c = S.custos.find(x => x.id === e.target.closest('tr').dataset.id); c.tipo = e.target.value; delete c.conferir; save(); updCustos(); } });
  body.addEventListener('click', e => { const b = e.target.closest('[data-rm]'); if (b) { S.custos = S.custos.filter(x => x.id !== b.dataset.rm); save(); cList(); updCustos(); } });
  $('#bkGen').addEventListener('click', async () => {
    const t = $('#bkText'); t.value = JSON.stringify(S); t.select();
    let copiado = false;
    try { await navigator.clipboard.writeText(t.value); copiado = true; } catch (e) { try { copiado = document.execCommand('copy'); } catch (e2) { } }
    const m = $('#bkMsg'); m.className = 'msg ok'; m.textContent = copiado ? 'Backup copiado. Cole em um e-mail, WhatsApp ou bloco de notas para guardar.' : 'Backup gerado. Selecione o texto e copie.';
  });
  const bf = $('#bkFile');
  if (bf) bf.addEventListener('click', async () => {
    const m = $('#bkMsg');
    try { const p = await window.vcExport(JSON.stringify(S)); m.className = 'msg ok'; m.textContent = 'Backup salvo em ' + p; }
    catch (e) { m.className = 'msg bad'; m.textContent = 'Não foi possível salvar: ' + e; }
  });
  $('#bkLoad').addEventListener('click', () => {
    const m = $('#bkMsg');
    try { const o = JSON.parse($('#bkText').value); if (!o || o.v !== 2) throw 0; S = migrate(o); save(); refreshDatalists(); renderCustos(); const m2 = $('#bkMsg'); m2.className = 'msg ok'; m2.textContent = 'Backup restaurado.'; }
    catch (e) { m.className = 'msg bad'; m.textContent = 'Texto de backup inválido. Cole o texto completo gerado pelo botão "Gerar backup".'; }
  });
  $('#bkReset').addEventListener('click', () => { S = fresh(); save(); refreshDatalists(); renderCustos(); });
}
function cList() {
  $('#cBody').innerHTML = S.custos.length ? S.custos.map(c => `<tr data-id="${c.id}">
    <td style="min-width:200px"><input type="text" data-c="nome" value="${esc(c.nome)}" aria-label="Origem">${c.conferir ? '<span class="badge" style="margin:4px 0 0;display:inline-block">confira o tipo</span>' : ''}</td>
    <td style="width:130px"><div class="affix"><span>R$</span><input type="text" inputmode="decimal" class="n" data-c="valor" value="${inv(c.valor)}" aria-label="Valor"></div></td>
    <td style="min-width:200px"><select data-c="tipo" aria-label="Tipo">${Object.entries(TIPOS).map(([k, t]) => `<option value="${k}"${c.tipo === k ? ' selected' : ''}>${t}</option>`).join('')}</select></td>
    <td style="width:80px"><input type="text" data-c="venc" value="${esc(c.venc || '')}" aria-label="Vencimento"></td>
    <td><button class="icon-btn" data-rm="${c.id}" aria-label="Remover">✕</button></td></tr>`).join('')
    : '<tr><td colspan="5" class="empty">Nenhum custo lançado.</td></tr>';
}
function adivinhaTipo(n) {
  n = norm(n);
  if (/EMPREST|FINANC|MAQUINARIO|PARCELA/.test(n)) return 'divida';
  if (/PRO.?LABORE|RETIRADA/.test(n)) return 'prolabore';
  if (/MERCADO ?PAGO|CIELO|STONE|PAGSEGURO|REDE|GETNET|SUMUP|TON\b|MAQUININHA|CARTAO/.test(n)) return 'cartao';
  if (/SIMPLES|IMPOSTO|\bDAS\b|ISS|ICMS/.test(n)) return 'imposto';
  if (/ALUGUEL|SALARIO|FGTS|INSS|ENERGIA|LUZ|AGUA|INTERNET|TELEFONE|CONTAB|ADVOG|SISTEMA|SOFTWARE|LIMPEZA|SEGURO|CONDOMINIO|IPTU|FILTRO|COLETA|RESIDUO/.test(n)) return 'fixo';
  return 'mercadoria';
}
function colar(substituir) {
  const linhas = $('#cPasteTxt').value.split(/\r?\n/).map(l => l.split(/\t|;/)).filter(c => c[0] && c[0].trim());
  const novos = [];
  for (const c of linhas) {
    const nome = c[0].trim(); const valor = num(c[1]);
    if (!ok(valor)) continue;
    novos.push({ id: uid(), nome, valor: r2(valor), tipo: adivinhaTipo(nome), conferir: true, venc: c[2] ? String(c[2]).trim().slice(0, 5) : '' });
  }
  const m = novos.length;
  if (!m) { $('#cPasteTxt').placeholder = 'Nada reconhecido. Cole duas colunas: nome e valor.'; $('#cPasteTxt').value = ''; return; }
  S.custos = substituir ? novos : S.custos.concat(novos);
  save(); $('#cPasteTxt').value = ''; $('#cPaste').hidden = true; cList(); updCustos();
}
function updCustos() {
  if (TAB !== 'custos') return;
  const P = S.params, b = base();
  const pesoFixo = b.fat > 0 ? b.fixos / b.fat : null;
  const margMeta = ((P.partProd || 0) * (P.margProd || 0) + (100 - (P.partProd || 0)) * (P.margServ || 0)) / 10000;
  const fatMeta = b.mc - margMeta > 0 ? b.fixos / (b.mc - margMeta) : null;
  const seg = b.pe && b.fat ? (b.fat - b.pe) / b.fat : null;
  const kl = (v, bom, ruim) => v == null ? '' : v <= bom ? 'ok' : v <= ruim ? 'warn' : 'bad';
  $('#cKpis').innerHTML = `
    <div class="kpi"><div class="l">Custos fixos do mês</div><div class="v">${money(b.fixos)}</div><div class="l">com empréstimos e pró-labore</div></div>
    <div class="kpi ${kl(pesoFixo, .40, .50)}"><div class="l">Peso dos fixos no faturamento</div><div class="v">${pct(pesoFixo)}</div><div class="l">Sebrae recomenda 30% a 40%</div></div>
    <div class="kpi"><div class="l">Ponto de equilíbrio</div><div class="v">${money(b.pe)}</div><div class="l">faturamento mínimo para não ter prejuízo</div></div>
    <div class="kpi ${seg == null ? '' : seg >= .2 ? 'ok' : seg >= 0 ? 'warn' : 'bad'}"><div class="l">Margem de segurança</div><div class="v">${pct(seg)}</div><div class="l">quanto o faturamento está acima do equilíbrio</div></div>
    <div class="kpi"><div class="l">Faturamento para atingir as margens</div><div class="v">${money(fatMeta)}</div><div class="l">lucro médio de ${pct(margMeta)}</div></div>
    <div class="kpi"><div class="l">Margem de contribuição média</div><div class="v">${pct(b.mc)}</div><div class="l">sobra das vendas após custos variáveis</div></div>`;
  let al = '';
  if (pesoFixo > .40) {
    const div = b.soma('divida'), pl = b.soma('prolabore');
    al = `<div class="alert ${pesoFixo > .5 ? 'bad' : 'warn'}"><b>Os custos fixos pesam ${pct(pesoFixo)} do faturamento</b>, acima dos 30% a 40% que o Sebrae recomenda. Desse total, ${money(div)} são empréstimos e financiamentos e ${money(pl)} é pró-labore. Para equilibrar: aumentar o volume de atendimentos, rever gastos ou renegociar dívidas. Subir todos os preços na mesma proporção costuma afastar clientes.</div>`;
  } else if (pesoFixo != null) al = `<div class="alert ok">Os custos fixos estão dentro da faixa recomendada pelo Sebrae (30% a 40% do faturamento).</div>`;
  if (b.fat > 0 && b.pe > b.fat) al += `<div class="alert bad">O faturamento médio (${money(b.fat)}) está abaixo do ponto de equilíbrio (${money(b.pe)}): a clínica fecha o mês no prejuízo.</div>`;
  $('#cAlert').innerHTML = al;
  const tipos = Object.keys(TIPOS).filter(t => t !== 'ignorar');
  $('#cTot').innerHTML = tipos.map(t => `<div class="kpi"><div class="l">${TIPOS[t]}</div><div class="v" style="font-size:1rem">${money(b.soma(t))}</div></div>`).join('');
  const h = id => $('#' + id);
  if (h('hFixProd')) h('hFixProd').textContent = `= ${money(b.fixProd)}, ou ${pct(b.dfProd)} do preço dos produtos. O resto (${money(b.fixServ)}) vai para os serviços pelo tempo de cada um.`;
  if (h('hImp')) h('hImp').textContent = `O boleto do Simples deste mês (${money(b.soma('imposto'))}) é ${pct(b.fat ? b.soma('imposto') / b.fat : null)} do faturamento. Confirme a alíquota com a contabilidade.`;
  if (h('hCartao')) h('hCartao').textContent = `Taxas de maquininha lançadas ÷ faturamento = ${pct(b.fat ? b.soma('cartao') / b.fat : null, 2)}`;
  if (h('hHoras')) h('hHoras').textContent = `Pelos serviços: ${fmt(b.minAuto / 60, 1)} h/mês → hora de ${money(b.minAuto ? b.fixServ / b.minAuto * 60 : null)}`;
}

/* ---------- início ---------- */
(async function init() {
  S = await load();
  setSaved('Tudo salvo');
  refreshDatalists();
  let t = 'produtos'; try { t = localStorage.getItem(KEY + '-tab') || t; } catch (e) { }
  show(['produtos', 'servicos', 'notas', 'custos'].includes(t) ? t : 'produtos');
})();
</script>
</body>
</html>
